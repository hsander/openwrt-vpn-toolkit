# JSON-Schema draft-07 written in YAML. Validates answers.yaml (user inputs to the wizard).
# See PROPOSAL.md §9 (answers.yaml) and §14 (wifi merge strategy).

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://openwrt-vpn-kit.dev/schemas/answers.schema.yaml"
title: answers.yaml
description: User inputs collected by the setup wizard.

type: object
required: [version, profile, router, vpn, telegram]
additionalProperties: false
properties:

  version:
    type: integer
    const: 1

  profile:
    enum: [minimal, standard, advanced]

  router:
    type: object
    required: [name, host, ssh_user]
    additionalProperties: false
    properties:
      name: {type: string, minLength: 1, pattern: '^[a-zA-Z0-9-]+$'}
      host: {type: string, minLength: 1}
      ssh_user: {type: string, minLength: 1}
      ssh_port: {type: integer, default: 22, minimum: 1, maximum: 65535}

  system:
    type: object
    properties:
      openwrt_min_major: {type: integer, default: 24}

  vpn:
    type: object
    required: [nodes]
    properties:
      nodes:
        type: array
        minItems: 1
        items:
          type: object
          required: [name, vless_url]
          additionalProperties: false
          properties:
            name: {type: string, pattern: '^[a-z0-9-]+$'}
            vless_url: {type: string, pattern: '^vless://'}
            pin_routes:
              type: array
              items: {type: string}
      routing:
        type: object
        properties:
          domains:
            type: array
            items: {type: string}
          subnets:
            type: array
            items: {type: string, pattern: '^\d{1,3}(\.\d{1,3}){3}(/\d{1,2})?$'}
          lan_full_vpn_clients:
            type: array
            items: {type: string}

  telegram:
    type: object
    required: [bot_token, chat_id]
    additionalProperties: false
    properties:
      bot_token: {type: string, minLength: 10}
      chat_id: {type: string, minLength: 1}
      channel_fallback:
        type: boolean
        default: true
        description: Enable direct+VPN fallback sending for watchdog alerts.

  zapret:
    type: object
    properties:
      enabled: {type: boolean, default: true}
      hosts:
        type: array
        items: {type: string}
      zapret_version:
        type: string
        default: v72.12
        description: Must match a key in templates/zapret/zapret.versions.yaml.

  wifi:
    type: object
    properties:
      enable: {type: boolean, default: false}
      merge_strategy:
        enum: [skip, patch_radios_only, append_iface, patch_and_append, overwrite]
        default: patch_and_append
      country:
        type: string
        pattern: '^[A-Z]{2}$'
        description: ISO 3166-1 alpha-2.
      aps:
        type: array
        items:
          type: object
          required: [band, ssid, password, encryption]
          additionalProperties: false
          properties:
            band: {enum: ['2g', '5g']}
            ssid: {type: string, minLength: 1, maxLength: 32}
            password: {type: string, minLength: 8}
            encryption: {enum: [psk2, sae, 'sae-mixed']}
            htmode: {type: string, description: e.g. HT40, VHT80, HE80}
      network: {type: string, default: lan}

  lan_proxy:
    type: object
    properties:
      enabled: {type: boolean, default: true}
      listen_zones:
        type: array
        items: {type: string}
        default: [lan]
      listen_mode:
        enum: [all_ifaces_in_zone, specific_ifaces]
        default: all_ifaces_in_zone
      listen_ifaces:
        type: array
        items: {type: string}
      port_base:
        type: integer
        minimum: 1024
        maximum: 65000
        default: 4000

  ssh_over_wan:
    type: object
    additionalProperties: false
    properties:
      enable: {type: boolean, default: false}
      port: {type: integer, default: 22, minimum: 1, maximum: 65535}

  snapshot_policy:
    type: object
    additionalProperties: false
    properties:
      keep_last_n: {type: integer, default: 5, minimum: 1}
      max_age_days: {type: integer, default: 7, minimum: 1}
      total_size_high_watermark_mb: {type: integer, default: 10}
      total_size_low_watermark_mb: {type: integer, default: 8}
      emergency_free_threshold_mb: {type: integer, default: 5}
